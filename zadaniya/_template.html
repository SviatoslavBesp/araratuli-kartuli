    <!-- Ввод ответа: варианты через | ; регистр и ё/е не важны -->

      <h2>1. Переведите</h2>
      <ol>
        <li><span class="ka big">სიტყვა</span> — <input type="text" data-answer="слово"></li>

      </ol>
    </section>
